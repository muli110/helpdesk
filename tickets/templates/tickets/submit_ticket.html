{% extends 'tickets/base.html' %}
{% block content %}
<h2>Submit a Ticket</h2>
<form method="post" class="mt-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Submit</button>
</form>
<a href="{% url 'ticket_list' %}" class="d-block mt-3">View my tickets</a>
{% endblock %}
