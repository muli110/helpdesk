{% extends 'tickets/base.html' %}
{% block content %}
<h2>Login</h2>
<form method="post" class="mt-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Login</button>
</form>
<a href="{% url 'tickets:register' %}" class="d-block mt-3">Don't have an account? Register</a>
{% endblock %}
