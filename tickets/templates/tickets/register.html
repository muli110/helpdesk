{% extends 'tickets/base.html' %}
{% block content %}
<h2>Register</h2>
<form method="post" class="mt-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Register</button>
</form>
<a href="{% url 'login' %}" class="d-block mt-3">Already have an account? Login</a>
{% endblock %}
